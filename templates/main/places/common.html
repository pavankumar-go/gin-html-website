<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta property="og:title" content="Pavan Kumar Photography">
    <meta name="image" property="og:image"
        content="https://www.pavankumar.photography/static/assets/images/places/wildlife/6/459.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Pavan Kumar Photography</title>
</head>

<script src="/scripts/base.js" async defer></script>

<!-- <script type="text/javascript" src="/scripts/no-print.js" async defer></script>  -->

<body oncontextmenu="return false;" ondragstart="return false;">
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-header">
            <div class="brand-name">Pavan Kumar Photography</div>
            <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        </div>
        <img class="lightbox-image" id="lightboxImage" src="" alt="" oncontextmenu="return false;" ondragstart="return false;">
        <button id="prevButton" class="lightbox-nav" onclick="navigateLightbox('prev')"><i class="fa fa-angle-left"></i></button>
        <button id="nextButton" class="lightbox-nav" onclick="navigateLightbox('next')"><i class="fa fa-angle-right"></i></button>
    </div>

    <!-- mobile-header -->
    <header class="mobile-header">
        <div class="brand-name">Pavan Kumar Photography</div>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="mobile-menu-overlay" id="mobile-menu">
        <div class="menu-header">
            <div class="brand-name">Pavan Kumar Photography</div>
            <div class="close-icon" onclick="toggleMenu()">
                &times;
            </div>
        </div>
        <nav>
            <ul class="nav-list">
                <li><a onclick="showSection('home', true)" href="/home">Home</a></li>
                <li><a onclick="showSection('collections',true)" class="active" href="/gallery">Collections</a></li>
                <li><a onclick="showSection('about', true)" href="/about">About</a></li>
            </ul>
        </nav>
    </div>

    <aside>
        <div>
            <div class="brand-name">
                Pavan Kumar<br>
                Photography
            </div>
            <nav>
                <ul class="nav-list">
                    <li><a onclick="showSection('home')" id="link-home" href="/home">Home</a></li>
                    <li><a onclick="showSection('collections')" id="link-collections" class="active"
                            href="/gallery">Collections</a></li>
                    <li><a onclick="showSection('about')" id="link-about" href="/about">About</a></li>
                </ul>
            </nav>
        </div>
        <div class="copyright">
            &copy; Copyright 2025 Pavan Kumar<br>
            Photography
        </div>
    </aside>
    <main>

        <!-- <section id="collections" class="active">
            <div class="gallery-grid">
                {{ range .Bird}}
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="/static/assets/images/places/wildlife/{{.PlaceID}}/{{.ID}}.jpg" alt="{{.Name}}"
                        loading="lazy"
                        decoding="async"
                        oncontextmenu="return false;" 
                        ondragstart="return false;">
                    <div class="gallery-caption">{{.Name}}&thinsp;</div>
                </div>
                {{end}}
            </div>
        </section> -->
        <section id="collections" class="active">
            <div class="gallery-grid">
                {{ range .Bird}}
                <div class="gallery-item" 
                     onclick="openLightbox(this)" 
                     data-full="/static/assets/images/places/wildlife/{{.PlaceID}}/{{.ID}}.jpg">

                    <img src="/static/assets/images/places/wildlife/{{.PlaceID}}/{{.ID}}_thumb.jpg" 
                         alt="{{.Name}}"
                         loading="lazy"
                         decoding="async">

                    <div class="gallery-caption">{{.Name}}&thinsp;</div>
                </div>
                {{end}}
            </div>
        </section>
    </main>
</body>

</html>
