services:
  website:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./website-data/website.db:/opt/app/website.db
      - ./website-data/places:/opt/app/static/assets/images/places
    restart: always
    environment:
      - SECRET_PATH=/run/secrets/app_secret
      - HOST_ADDRESS=https://www.anything.photo
      - PLACES=blr,mandyamysuru,jbr,cauvery,jakarta,thattekad,ramanagar,thirthahalli,andaman,bandipur,chikkaballapur,dandeli,corbett,munnar,malaysia,vietnam
    secrets:
      - app_secret
    deploy:
      replicas: 1
